aid: cricapi
name: CricAPI
description: >
  CricAPI (now operating as CricketData.org) is a cricket data API platform
  that has provided free, high-performance cricket data since September 2015.
  The API delivers live scores, ball-by-ball updates, match details, player
  statistics, team rankings, schedules, and fantasy cricket scorecard data for
  international and domestic tournaments including ICC, IPL, T20, BBL, and PSL.
  Developers can access historical match data going back to 2000, widgets for
  website integration, and a fantasy cricket API designed for league operators.
  The platform is ISO 9001:2015 certified and uses its own AI engine with human
  data entry rather than scraping third-party sources.
