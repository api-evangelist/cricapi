    name: Cricket Data API
    description: >
      The Cricket Data API provides live cricket scores, ball-by-ball updates,
      player statistics, match details, team rankings, schedules, and historical
      match data. It supports fantasy cricket league operations with dedicated
      fantasy scorecard endpoints. Coverage spans international and domestic
      tournaments including ICC events, IPL, T20I, BBL, PSL, and List A cricket.
